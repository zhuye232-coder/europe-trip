<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <title>欧洲夏日行程</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="hero">
        <p class="brand">旅行助手</p>
        <h1>2026 欧洲夏日行程</h1>
        <p class="subtitle">巴黎 · 苏黎世 · 威尼斯 · 佛罗伦萨 · 罗马 · 尼斯 · 蒙彼利埃</p>
      </div>
      <button id="themeToggle" class="icon-button" aria-label="切换主题">☀️</button>
    </header>

    <nav class="tab-bar">
      <button class="tab-button active" data-tab="overview">概览</button>
      <button class="tab-button" data-tab="transport">大交通</button>
      <button class="tab-button" data-tab="hotels">酒店</button>
      <button class="tab-button" data-tab="daily">每日</button>
      <button class="tab-button" data-tab="todo">待办</button>
    </nav>

    <main class="content">
      <section id="overview" class="tab-panel active">
        <div class="section-title">行程概览</div>
        <div id="overviewCard" class="overview-card"></div>
        <div id="overviewList" class="section-grid"></div>
      </section>

      <section id="transport" class="tab-panel">
        <div class="section-title">大交通</div>
        <div id="transportList" class="section-grid"></div>
      </section>

      <section id="hotels" class="tab-panel">
        <div class="section-title">酒店 & 住宿</div>
        <div id="hotelList" class="section-grid"></div>
      </section>

      <section id="todo" class="tab-panel">
        <div class="section-title">行程待办</div>
        <form id="todoForm" class="todo-form">
          <input id="todoInput" type="text" placeholder="添加新的待办事项，例如：准备护照、预定餐厅" />
          <button type="submit">添加待办</button>
        </form>
        <div id="todoList" class="section-grid"></div>
      </section>

      <section id="daily" class="tab-panel">
        <div class="section-title">每日行程</div>
        <div id="dailyList" class="section-grid"></div>
      </section>
    </main>

    <footer class="app-footer">
      <p>已根据您的行程单自动生成，适合手机浏览，支持离线访问。</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
